<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebXR Marker AR</title>
  
  <!-- A-Frame and AR.js libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  
  <!-- Custom Clean UI Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AR.js 3D WebGL Scene Container -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium; powerPreference: high-performance;">
    
    <!-- Scene Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; color: #00f3ff; intensity: 1.4;" position="2 4 2"></a-entity>
    <a-entity light="type: directional; color: #ff9900; intensity: 0.8;" position="-2 -1 -2"></a-entity>

    <!-- Hiro Marker Tracking Target -->
    <a-marker 
      preset="hiro" 
      id="hiro-marker" 
      emitevents="true" 
      smooth="true" 
      smoothCount="10" 
      smoothTolerance="0.01" 
      smoothThreshold="5">
      
      <!-- Anchored 3D Cyber Recon Drone Model -->
      <a-entity 
        id="drone-model" 
        gltf-model="assets/model_optimized.glb" 
        scale="0.5 0.5 0.5" 
        position="0 0.35 0" 
        drone-hover>
      </a-entity>

      <!-- Holographic Anchoring Targeting Ring on Marker Plane -->
      <a-ring 
        id="marker-ring" 
        color="#00f3ff" 
        radius-inner="0.65" 
        radius-outer="0.75" 
        rotation="-90 0 0" 
        position="0 0.02 0" 
        material="opacity: 0.85; transparent: true; emissive: #00f3ff; emissiveIntensity: 0.5;"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 6000; easing: linear;">
      </a-ring>

      <!-- Reactive Energy Shield / Shockwave Sphere -->
      <a-sphere 
        id="shockwave-sphere" 
        radius="1.0" 
        position="0 0.35 0" 
        visible="false" 
        material="color: #00f3ff; transparent: true; opacity: 0.0; side: double; roughness: 0.1;">
      </a-sphere>

    </a-marker>

    <!-- Static Camera Entity -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Clean Futuristic Minimalist HUD Overlay Layer -->
  <div id="ar-hud">
    
    <!-- Top Header: Centered Status Pill & Compact Telemetry Badge -->
    <header class="hud-header">
      <div id="status-pill" class="status-pill searching interactive">
        <div class="status-dot"></div>
        <span id="status-text">SCANNING FOR HIRO MARKER</span>
      </div>

      <div class="telemetry-badge interactive" id="telemetry-badge">
        <span class="badge-fps" id="val-fps">60 FPS</span>
        <span class="badge-sep">|</span>
        <span class="badge-tris" id="val-tris">2,504 tris</span>
      </div>
    </header>

    <!-- Bottom Controls Toolbar -->
    <footer class="hud-footer">
      <div class="button-row">
        <button id="btn-react" class="btn-clean-action interactive" type="button">
          ⚡ React
        </button>
        <button id="btn-switch-model" class="btn-clean interactive" type="button">
          🔄 Low-Poly
        </button>
        <button id="btn-wireframe" class="btn-clean interactive" type="button">
          🔲 Wireframe
        </button>
        <button id="btn-flip-camera" class="btn-clean interactive" type="button">
          🪞 Mirror
        </button>
        <button id="btn-show-marker" class="btn-clean interactive" type="button">
          🎯 Marker
        </button>
        <button id="btn-clean-view" class="btn-clean interactive" type="button" title="Hide buttons for clean screenshot">
          👁️ Clean
        </button>
      </div>
    </footer>

  </div>

  <!-- Camera Permission Prompt Button (Only shown if camera blocked) -->
  <button id="btn-start-camera" class="btn-camera-prompt interactive" type="button">
    📷 Click to Enable Camera
  </button>

  <!-- On-Screen Marker Modal -->
  <div id="marker-modal" class="modal-overlay">
    <div class="modal-dialog">
      <h2>Hiro Tracking Target</h2>
      <p>Hold this marker in front of your camera, or view on another device.</p>
      <div class="marker-frame">
        <img src="hiro.png" alt="Hiro Marker Target">
      </div>
      <button id="btn-close-modal" class="modal-close" type="button">Close Marker</button>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
